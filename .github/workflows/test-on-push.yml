name: tests

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    verify:
        strategy:
            fail-fast: false
            matrix:
                platform: [ubuntu-latest, macos-14, windows-latest]
        runs-on: ${{ matrix.platform }}
        timeout-minutes: 90
        env:
            ENABLE_INTERNAL: "0"
            PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
            UV_PYTHON: "3.13"
            CARGO_TERM_COLOR: always
        steps:
            - uses: actions/checkout@v6
              with:
                  submodules: recursive

            - uses: actions/setup-node@v6
              with:
                  node-version: "24"

            - uses: pnpm/action-setup@v4
              with:
                  version: 10.26.1

            - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
              with:
                  version: "0.13.0"
                  python-version: "3.13"

            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt

            - uses: swatinem/rust-cache@v2
              with:
                  workspaces: ". -> target"

            - name: Free Linux build space
              if: runner.os == 'Linux'
              uses: jlumbroso/free-disk-space@main
              with:
                  tool-cache: false
                  android: true
                  dotnet: true
                  haskell: true
                  large-packages: true
                  docker-images: true
                  swap-storage: true

            - name: Install Linux build dependencies
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y build-essential cmake pkg-config libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libpulse-dev libasound2-dev

            - name: Install macOS build dependencies
              if: runner.os == 'macOS'
              run: brew install cmake

            - name: Set up MSVC
              if: runner.os == 'Windows'
              uses: TheMrMilchmann/setup-msvc-dev@v3
              with:
                  arch: x64

            - name: Install CUDA
              if: runner.os == 'Windows'
              uses: Jimver/cuda-toolkit@master
              with:
                  log-file-suffix: windows.txt

            - name: Create Windows CUDA resource directory
              if: runner.os == 'Windows'
              run: New-Item -ItemType Directory -Force -Path target/windows-cuda-redist/resources/cuda | Out-Null

            - name: Install locked JavaScript dependencies
              run: pnpm install --frozen-lockfile

            - name: Install locked Python dependencies
              run: uv sync --locked --group test --python 3.13

            - name: Install Chromium and system dependencies
              if: runner.os == 'Linux'
              run: pnpm exec playwright install --with-deps chromium

            # Mirrors `pnpm verify` with per-platform limits; keep the two in sync.
            - name: Check
              run: pnpm check

            - name: Build frontend
              run: pnpm build

            - name: Unit tests
              run: pnpm test:unit

            - name: Shared tests
              run: pnpm test:shared

            - name: Screenshot tooling tests
              run: pnpm test:screenshots

            - name: Check macOS screenshot helper
              if: runner.os == 'macOS'
              run: swiftc -typecheck scripts/screenshots/macos.swift

            - name: Build Windows screenshot helper
              if: runner.os == 'Windows'
              run: |
                  $tokens = $null
                  $errors = $null
                  [System.Management.Automation.Language.Parser]::ParseFile("${{ github.workspace }}/scripts/screenshots/windows.ps1", [ref]$tokens, [ref]$errors) | Out-Null
                  if ($errors.Count) { throw ($errors | Out-String) }
                  dotnet build scripts/screenshots/windows-capture/Capture.csproj -c Release -o target/screenshots/ci-helper -p:BaseIntermediateOutputPath="${{ github.workspace }}/target/screenshots/ci-obj/"

            - name: Python tests
              run: pnpm test:python

            - name: Rust tests
              if: runner.os != 'Windows'
              run: pnpm test:rust

            - name: Rust test build
              if: runner.os == 'Windows'
              run: pnpm test:rust:build

            - name: Packaging tests
              if: runner.os != 'macOS'
              run: pnpm test:packaging

            - name: Browser tests
              if: runner.os == 'Linux'
              run: pnpm test:browser

            - name: Internal hook
              if: runner.os != 'Windows'
              run: pnpm test:internal

            - name: Internal hook build
              if: runner.os == 'Windows'
              run: pnpm test:internal --no-run

            - name: Formatting and whitespace
              run: cargo fmt --all --check && git diff --check && git -C utils diff --check

            - name: Save test reports and failure artifacts
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: test-results-${{ matrix.platform }}
                  path: |
                      target/test-results/*.json
                      target/test-results/*.xml
                      target/test-results/browser/
                      target/test-results/python/
                  if-no-files-found: ignore
