[project]
name = "scrybe-tests"
version = "0.0.0"
requires-python = ">=3.10"

[dependency-groups]
test = ["pytest==9.1.1"]

[tool.uv]
package = false
default-groups = ["test"]

[tool.pytest.ini_options]
testpaths = ["tests/python/unit"]
addopts = "-ra --strict-config --strict-markers"
cache_dir = "target/test-results/.pytest_cache"
pythonpath = ["."]
markers = [
    "webkit: Linux WebKitGTK motion checks",
    "native: Linux Tauri and accessibility checks",
    "audio: private Linux sound-server checks",
    "inference: explicit local Whisper and VAD inputs",
]
